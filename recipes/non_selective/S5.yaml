# S5 -- inherits shared config from base.yaml; only the mixer block differs.
base: ../base.yaml

model_cfg:
  d_state: 256
  d_conv: 4
  expand: 2
  norm_epsilon: 1.0e-05
  causal_conv: true
  ssm: s5
  ssm_params:
    conj_sym: true
    clip_eigs: false
    block_count: 1
    dt_min: 0.001
    dt_max: 0.1
