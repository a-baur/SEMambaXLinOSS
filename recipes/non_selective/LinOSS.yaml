# LinOSS -- inherits shared config from base.yaml; only the mixer block differs.
base: ../base.yaml

model_cfg:
  use_phase_fan: false
  use_fan_denseblock: false
  ssm: linoss
  d_state: 64
  d_conv: 4
  expand: 2
  norm_epsilon: 1.0e-05
  causal_conv: true
  ssm_params:
    discretization: IMEX
    damping: true
    r_min: 0.9
    theta_max: 3.141592653589793
    a_from_g: false
    use_triton: true
