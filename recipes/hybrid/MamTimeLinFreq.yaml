# MamTimeLinFreq -- inherits shared config from base.yaml; only the mixer block differs.
base: ../base.yaml

model_cfg:
  time_mixer:
    ssm: mamba
    d_state: 16
    d_conv: 4
    expand: 4
    norm_epsilon: 1.0e-05
  freq_mixer:
    ssm: linoss
    d_state: 16
    d_conv: 4
    expand: 4
    norm_epsilon: 1.0e-05
    causal_conv: true
    ssm_params:
      discretization: IMEX
      damping: true
      r_min: 0.9
      theta_max: 3.141592653589793
      use_triton: true
