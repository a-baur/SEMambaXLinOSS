# SelectiveLRUMIMO -- inherits shared config from base.yaml; only the mixer block differs.
base: ../base.yaml

model_cfg:
  time_mixer:
    d_state: 64
    d_conv: 4
    expand: 2
    norm_epsilon: 1.0e-05
    causal_conv: true
    ssm: selective_lru_mimo
    ssm_params:
      n_heads: 2
      rank: 1
      theta_max: 0.8
      n_real_modes: 16  # per head
      envelope_readout: False
      mode_detune: False
      rate_scale: 1.0
      selective_init_std: 0.01
      use_triton: true
      input_gain: "zoh"

  freq_mixer:
    d_state: 64
    d_conv: 4
    expand: 2
    norm_epsilon: 1.0e-05
    causal_conv: false
    ssm: selective_lru_mimo
    ssm_params:
      n_heads: 2
      rank: 1
      n_real_modes: 16
      envelope_readout: False
      mode_detune: False
      rate_scale: 1.0
      selective_init_std: 0.01
      use_triton: true
      input_gain: "zoh"