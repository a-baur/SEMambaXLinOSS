# SelectiveLRU -- inherits shared config from base.yaml; only the mixer block differs.
base: ../base.yaml

model_cfg:
  use_phase_fan: false
  use_fan_denseblock: false
  d_state: 8
  d_conv: 4
  expand: 4
  norm_epsilon: 1.0e-05
  causal_conv: true
  ssm: selective_lru
  ssm_params:
    dt_rank: null
    dt_min: 0.001
    dt_max: 0.1
    theta_max: 3.141592653589793
    init_std: 0.01
    use_triton: true
    chunk_size: 16
    block_c: 32
