# Mamba2 -- inherits shared config from base.yaml; only the mixer block differs.
base: ../base.yaml

model_cfg:
  use_phase_fan: false
  use_fan_denseblock: false
  ssm: mamba2
  d_state: 128
  d_conv: 4
  expand: 4
  norm_epsilon: 1.0e-05
  ssm_params:
    headdim: 64
    ngroups: 1
    d_ssm: null
    conv_init: null
    A_init_range:
    - 1
    - 16
    D_has_hdim: false
    rmsnorm: true
    norm_before_gate: false
    dt_min: 0.001
    dt_max: 0.1
    dt_init_floor: 0.0001
    dt_limit:
    - 0.0
    - .inf
    bias: false
    conv_bias: true
    chunk_size: 256
    use_mem_eff_path: true
