# Mamba3 -- inherits shared config from base.yaml; only the mixer block differs.
base: ../base.yaml

model_cfg:
  use_phase_fan: false
  use_fan_denseblock: false
  ssm: mamba3
  d_state: 128
  d_conv: 4
  expand: 4
  norm_epsilon: 1.0e-05
  ssm_params:
    headdim: 64
    ngroups: 1
    rope_fraction: 0.5
    dt_min: 0.001
    dt_max: 0.1
    dt_init_floor: 0.0001
    A_floor: 0.0001
    is_outproj_norm: false
    is_mimo: false
    mimo_rank: 4
    fuse_pregate_headwise_norm: true
    chunk_size: 64
    dropout: 0.0
